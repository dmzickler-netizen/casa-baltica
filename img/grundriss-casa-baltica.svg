<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 900" width="540" height="900" role="img" aria-label="Grundriss der Ferienwohnung mit Schlafzimmer, zweitem Schlafzimmer, Wohn- und Essbereich, Küche, Bad, Flur und Außenbereich" style="display: block; font-family: Manrope, 'Helvetica Neue', Arial, sans-serif">
